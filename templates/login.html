<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Generador de Informes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #0f172a; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: white; border-radius: 16px; padding: 36px;
    width: 100%; max-width: 380px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center;
  }
  .login-logo { width: 120px; height: auto; margin: 0 auto 20px;
    display: block; border-radius: 10px; }
  .login-card h1 { font-size: 20px; margin-bottom: 6px; }
  .login-card p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
  .login-card input {
    width: 100%; border: 1px solid #cbd5e1; border-radius: 10px;
    padding: 14px; font-size: 15px; font-family: inherit; margin-bottom: 14px;
  }
  .login-card input:focus { outline: none; border-color: #f97316;
    box-shadow: 0 0 0 3px rgba(249,115,22,0.1); }
  .btn {
    width: 100%; background: #f97316; color: white; border: none;
    padding: 14px; border-radius: 10px; font-size: 16px;
    font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .btn:hover { background: #ea580c; }
  .error {
    background: #fef2f2; border: 1px solid #fecaca;
    border-radius: 8px; padding: 10px 12px; font-size: 14px;
    color: #991b1b; margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="login-card">
    <img class="login-logo" src="{{ url_for('static', filename='logo-dag.png') }}" alt="DAG">
    <h1>Generador de Informes</h1>
    <p>Ingresá la clave de acceso del estudio</p>
    {% if error %}
      <div class="error">⚠️ Clave incorrecta. Intentá de nuevo.</div>
    {% endif %}
    <form method="POST" action="{{ url_for('login') }}">
      <input type="password" name="password" placeholder="Clave de acceso"
             autofocus autocomplete="current-password">
      <button class="btn" type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
